<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="60%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <!-- Outer Border Glow Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Logo Letter Gradient -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle / Rounded Tech Badge Container -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="92" cy="36" r="28" fill="#38BDF8" opacity="0.18"/>
  <circle cx="36" cy="92" r="28" fill="#34D399" opacity="0.15"/>

  <!-- Geometric Modern 'K' Monogram -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <rect x="34" y="28" width="14" height="72" rx="7" fill="url(#kGrad)"/>
    
    <!-- Upper Diagonal Arm -->
    <path d="M 44 64 L 75 35 C 78 32 83 32 86 35 C 89 38 89 43 86 46 L 59 71 Z" fill="url(#kGrad)"/>
    
    <!-- Lower Diagonal Arm -->
    <path d="M 54 58 L 84 92 C 87 95 87 100 84 103 C 81 106 76 106 73 103 L 45 72 Z" fill="url(#accentGrad)"/>
    
    <!-- Core Data Node Accent -->
    <circle cx="92" cy="33" r="5" fill="#38BDF8"/>
    <circle cx="92" cy="33" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
